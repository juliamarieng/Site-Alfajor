<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}{{ config.LOJA_NOME }} — doces artesanais sob encomenda{% endblock %}</title>
  <meta name="description" content="Brigadeiros, beijinhos, alfajores e outros doces artesanais. Escolha seus doces e envie o pedido pelo WhatsApp.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topo">
    <a class="marca" href="#inicio">{{ config.LOJA_NOME }}</a>
    <nav aria-label="Principal">
      <a href="#vitrine">Vitrine</a>
      <a href="#pedido">Fazer pedido</a>
    </nav>
  </header>

  <main id="inicio">
    {% block conteudo %}{% endblock %}
  </main>

  <footer class="rodape">
    <p>{{ config.LOJA_NOME }} · Pedidos pelo WhatsApp</p>
  </footer>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
