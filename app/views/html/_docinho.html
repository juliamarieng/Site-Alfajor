{% macro docinho(d, tamanho=120) -%}
<svg viewBox="0 0 120 120" width="{{ tamanho }}" height="{{ tamanho }}" xmlns="http://www.w3.org/2000/svg" focusable="false" aria-hidden="true">
  {% if d.tipo == 'alfajor' -%}
  <ellipse cx="60" cy="102" rx="40" ry="5" fill="#3a1230" opacity=".15"/>
  <rect x="20" y="68" width="80" height="22" rx="11" fill="{{ d.cor }}"/>
  <rect x="20" y="68" width="80" height="22" rx="11" fill="#000" opacity=".08"/>
  <rect x="16" y="55" width="88" height="17" rx="8.5" fill="{{ d.topo }}"/>
  {% for x in [18, 25, 32, 88, 95, 102] -%}
  <rect x="{{ x }}" y="{{ 58 + (loop.index0 % 3) * 4 }}" width="6" height="3" rx="1.5" fill="#fff8ec" transform="rotate({{ loop.index0 * 25 }} {{ x }} 60)"/>
  {% endfor -%}
  <rect x="20" y="33" width="80" height="27" rx="13.5" fill="{{ d.cor }}"/>
  <ellipse cx="44" cy="41" rx="13" ry="4" fill="#ffffff" opacity=".35"/>
  {% for p in [[56,44],[68,40],[80,46],[62,51],[48,52],[76,54],[88,50]] -%}
  <circle cx="{{ p[0] }}" cy="{{ p[1] }}" r="1.7" fill="#ffffff" opacity=".9"/>
  {% endfor -%}
  {% else -%}
  <ellipse cx="60" cy="108" rx="34" ry="5" fill="#3a1230" opacity=".15"/>
  <circle cx="60" cy="58" r="32" fill="{{ d.cor }}"/>
  <ellipse cx="48" cy="46" rx="9" ry="5" fill="#ffffff" opacity=".25" transform="rotate(-30 48 46)"/>
  {% for p in [[44,48],[60,40],[76,50],[52,60],[68,62],[60,52],[40,62],[80,62]] -%}
  <rect x="{{ p[0] }}" y="{{ p[1] }}" width="7" height="3" rx="1.5" fill="{{ d.topo }}" transform="rotate({{ loop.index0 * 37 }} {{ p[0] }} {{ p[1] }})"/>
  {% endfor -%}
  <path d="M26 70 L34 100 Q60 112 86 100 L94 70 Q60 82 26 70 Z" fill="#e23d68"/>
  <path d="M26 70 Q60 82 94 70" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="2"/>
  <path d="M40 76 L44 104 M52 79 L54 108 M64 80 L66 108 M76 79 L78 105" stroke="#ffffff" stroke-opacity=".28" stroke-width="2"/>
  {% endif -%}
</svg>
{%- endmacro %}
